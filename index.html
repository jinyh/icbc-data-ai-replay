 &quot;kind&quot;: &quot;贷款申请&quot;,\n    &quot;doc_date&quot;: &quot;2026-08-20&quot;,\n    &quot;available_at&quot;: &quot;2026-08-20&quot;,\n    &quot;scope&quot;: &quot;虚构借款人单体&quot;,\n    &quot;claim&quot;: &quot;申请3000万元；2400万元采购、600万元工资及流转&quot;,\n    &quot;status&quot;: &quot;申请人陈述&quot;\n  },\n  {\n    &quot;doc_id&quot;: &quot;D02&quot;,\n    &quot;kind&quot;: &quot;2025单体财务报表&quot;,\n    &quot;doc_date&quot;: &quot;2026-04-20&quot;,\n    &quot;available_at&quot;: &quot;2026-08-21&quot;,\n    &quot;scope&quot;: &quot;沪澜精密传感科技有限公司&quot;,\n    &quot;claim&quot;: &quot;营业收入9600万元；经营现金流净额480万元&quot;,\n    &quot;status&quot;: &quot;合成报表；未作审计保证&quot;\n  },\n  {\n    &quot;doc_id&quot;: &quot;D03&quot;,\n    &quot;kind&quot;: &quot;2025集团合并财务报表&quot;,\n    &quot;doc_date&quot;: &quot;2026-04-20&quot;,\n    &quot;available_at&quot;: &quot;2026-08-21&quot;,\n    &quot;scope&quot;: &quot;沪澜智造集团&quot;,\n    &quot;claim&quot;: &quot;营业收入21000万元；经营现金流净额3000万元&quot;,\n    &quot;status&quot;: &quot;合成报表；不可替代借款主体单体&quot;\n  },\n  {\n    &quot;doc_id&quot;: &quot;D04&quot;,\n    &quot;kind&quot;: &quot;应收明细与合同/验收&quot;,\n    &quot;doc_date&quot;: &quot;2026-08-31&quot;,\n    &quot;available_at&quot;: &quot;2026-08-31&quot;,\n    &quot;scope&quot;: &quot;单体，2025期初与2026年1-8月&quot;,\n    &quot;claim&quot;: &quot;期初2200+本期5500-已配对回款4000=期末3700万元&quot;,\n    &quot;status&quot;: &quot;初版；T10未配对&quot;\n  },\n  {\n    &quot;doc_id&quot;: &quot;D05&quot;,\n    &quot;kind&quot;: &quot;可见账户流水&quot;,\n    &quot;doc_date&quot;: &quot;2026-08-31&quot;,\n    &quot;available_at&quot;: &quot;2026-08-31&quot;,\n    &quot;scope&quot;: &quot;仅ACCT-01，2026年1-8月&quot;,\n    &quot;claim&quot;: &quot;入账6200万元&quot;,\n    &quot;status&quot;: &quot;账户覆盖不完整，不能直接推断全企业现金流&quot;\n  },\n  {\n    &quot;doc_id&quot;: &quot;D06&quot;,\n    &quot;kind&quot;: &quot;资金归集协议主文&quot;,\n    &quot;doc_date&quot;: &quot;2026-01-01&quot;,\n    &quot;available_at&quot;: &quot;2026-08-28&quot;,\n    &quot;scope&quot;: &quot;ACCT-01与POOL-A；有效至2026-12-31&quot;,\n    &quot;claim&quot;: &quot;T07的900万元可解释为约定账户归集返还&quot;,\n    &quot;status&quot;: &quot;T08付款账户未列明&quot;\n  },\n  {\n    &quot;doc_id&quot;: &quot;D07&quot;,\n    &quot;kind&quot;: &quot;已有融资证明&quot;,\n    &quot;doc_date&quot;: &quot;2026-08-25&quot;,\n    &quot;available_at&quot;: &quot;2026-08-28&quot;,\n    &quot;scope&quot;: &quot;借款主体单体&quot;,\n    &quot;claim&quot;: &quot;现有流贷余额1200万元，可提用额度500万元&quot;,\n    &quot;status&quot;: &quot;合成函件&quot;\n  },\n  {\n    &quot;doc_id&quot;: &quot;D08&quot;,\n    &quot;kind&quot;: &quot;采购计划与订单&quot;,\n    &quot;doc_date&quot;: &quot;2026-08-23&quot;,\n    &quot;available_at&quot;: &quot;2026-08-27&quot;,\n    &quot;scope&quot;: &quot;借款主体单体&quot;,\n    &quot;claim&quot;: &quot;已签采购订单1700万元；其余700万元采购计划待供应商确认&quot;,\n    &quot;status&quot;: &quot;不能单独证成3000万元净缺口&quot;\n  }\n]\u003c/pre>\u003c/details>", "takeaway": "财务范围、账户覆盖和可得时点共同限定结论。", "record": null}, {"chapter": "融资证据", "title": "模型读取初始材料并提出取证", "question": "模型凭哪些材料形成判断？", "content": "\u003cp class=\"badge\">目标模型：Qwen3.8-max\u003cbr>以下为既有录制回应示例\u003c/p>\u003cdiv class=\"model-excerpt\">\u003cp>借款主体是沪澜精密传感科技有限公司。\u003c/p>\u003c/div>\u003cdetails>\u003csummary>模型完整回应（原样保留）\u003c/summary>\u003cpre># 沪澜精密传感融资核验：初始材料判断\n\n材料截点：2026-08-31。案例为教学合成；以下是材料解释和分类建议，不构成授信批准，也未修改业务数据。材料摘录不提供真实性保证。本次使用受控入口读取材料一次、执行只读核对查询一次。\n\n## 结论与推理摘要\n\n借款主体是沪澜精密传感科技有限公司。D02 的 2025 年单体营业收入为 9600 万元、经营现金流净额为 480 万元；D03 的集团合并营业收入 21000 万元、经营现金流净额 3000 万元属于沪澜智造集团，不能替代借款主体单体，也不能直接证明集团资金可用于偿还单体债务。两份报表是不同财务范围，不能相加。[D02、D03]\n\nACCT-01 在 2026 年 1—8 月可见 11 笔入账合计 6200 万元，查询求和与 D05 一致。T01—T06 合计 4000 万元，与 D04 初版已配对回款总额一致，可作为客户回款的初步分类；T07 的 900 万元有归集协议支持“约定账户归集返还”的解释；T09 的 300 万元按流水名义暂列税费退款；T08、T10、T11 合计 1000 万元仍未确定性质。这个分解是当前证据下的解释，不代表每项均已获得完整原始凭证验证。[D04—D06、T01—T11]\n\n6200 万元只证明该可见账户的入账总量，不能证明 6200 万元销售收入、全企业总回款或经营现金流净额。客户回款可能收回以前年度应收，归集返还可能只是既有资金返回，税费退款不是销售回款，其他款项仍未知。账户覆盖不完整且未给出支出、资金余额和全账户流水，不能由入账总额推断可支配现金、现金净增加额或偿债能力。2025 年报表与 2026 年 1—8 月入账也不是相同期间。[D02、D04—D06、T01—T11]\n\n## 逐笔分类建议\n\n| 入账 | 金额（万元） | 当前建议 | 来源与依据 |\n|---|---:|---|---|\n| T01 | 700 | 客户回款（初步配对，账龄归属待核） | 付款人为宁波源控，参考号 O01；与 T02—T06 合计 4000，与 D04 已配对总额一致。摘录未列逐笔勾稽，不能仅凭 O01 判断属于期初应收。[T01、D04] |\n| T02 | 500 | 客户回款（初步配对，账龄归属待核） | 付款人为苏州晶测，参考号 O02；同属上述 4000 万元候选组合。O02 本身不能证明收入确认年度。[T02、D04] |\n| T03 | 900 | 客户回款（初步配对） | 宁波源控、参考号 I01；属于 T01—T06 组合。金额总计一致仅支持初步判断，还需逐笔合同、验收、发票及应收核销映射。[T03、D04] |\n| T04 | 900 | 客户回款（初步配对） | 苏州晶测、参考号 I02；依据同上，不能由参考号直接认定当期销售收入。[T04、D04] |\n| T05 | 600 | 客户回款（初步配对） | 嘉兴微构、参考号 I03；依据同上。[T05、D04] |\n| T06 | 400 | 客户回款（初步配对；与 T10 联合核对 I04） | 合肥纳仪、参考号 I04；T10 也引用 I04，需核对该笔与 T10 对应的同一义务及未收余额，避免重复配对。[T06、T10、D04] |\n| T07 | 900 | 资金归集返还（有协议支持，待资金路径核验） | 付款账户已列明，参考 POOL-A；D06 覆盖 ACCT-01 与 POOL-A，且转入日期在协议有效期内。支持约定归集返还的解释；需原归集流出和资金台账闭环，不能当作新增销售回款或新创造的资金。[T07、D06] |\n| T08 | 400 | 性质待核的集团相关入账 | 来自未列明账户 POOL-B。D06 未覆盖该付款账户，不能把 T07 的判断直接套用。可能是另有约定的归集返还、集团拆借或其他往来；现有材料不能选定一种，也不能只因未列明便判为违规。[T08、D06] |\n| T09 | 300 | 税费退款（按流水名义暂列） | 付款名义为税费退还、参考 TAX-01；尚无税务退款决定或税种期间明细。暂不列销售回款；能否列入特定现金流报表项目需要凭证和会计口径。[T09、D05] |\n| T10 | 450 | 第三方入账待核；候选为代付客户回款 | 第三方 X 的代付关系待证，虽引用 I04，仍不能证明是在履行合肥纳仪的债务。D04 明确未配对；还可能是其他往来、预收或误付款。先核对付款授权、双方确认、I04 未收额以及 T06 的 400 万元，当前不据此调减应收。[T10、T06、D04] |\n| T11 | 150 | 未识别入账 | 名义付款人未核实，参考 UNKNOWN；缺少交易背景，不归为销售回款、归集返还或融资。[T11、D05] |\n\n以上分类是建议，不是记账或核销指令。D04 只提供已配对总额，T01—T06 的合计吻合不等于获得了完整逐笔配对表。\n\n## 应收核对\n\nD04 摘录给出的算式是：2200 + 5500 - 4000 = 3700 万元。算术正确；3700 万元应作为“初版明细所报余额”，不能据此声称完成了余额真实性、完整性或账龄验证。[D04]\n\nD04 的范围写作“单体，2025 期初与 2026 年 1—8 月”。这存在期间歧义：2200 万元是否为 2026 年期初，或确为 2025 年期初，现有材料没有说清。如果是 2025 年期初，则缺少 2025 年完整变动和转入 2026 年的连续勾稽；不能自行把它改写成 2026 年期初。还需明确 5500 万元是本期应收增加口径还是收入口径，以及是否含税、是否计入退货折让或其他调整。[D04]\n\nT10 的 450 万元已包含在 6200 万元入账中，但在 D04 未配对。当前保留 D04 的 3700 万元所报余额，暂不追加回款。只有在期间口径核定、第三方代付关系成立、450 万元全部用于清偿既有应收、未与 T06 或已配对 4000 万元重复、I04 剩余债权足够且不存在其他调整的条件下，才能测算 3700 - 450 = 3250 万元。3250 万元是条件测算，不是当前已核实期末余额；若只能确认部分用于应收，应按确认部分测算。[D04、T06、T10]\n\n应逐笔建立“合同/验收/发票—应收分录—付款人或代付关系—银行入账—核销记录”的对应关系。T01、T02 的 O01、O02，以及其余 I01—I04，不足以单独判断期初与本期回款的分配。T08、T11 未查明前也不纳入应收回款。[D04、T01—T06、T08、T10、T11]\n\n## 申请用途与资金缺口\n\n申请金额 3000 万元，其中采购 2400 万元、工资及流转 600 万元，是申请人陈述。[D01]\n\nD08 支持已签采购订单 1700 万元，其余 700 万元采购计划仍待供应商确认；1700 + 700 = 2400 万元与采购预算算术一致，但签约采购额不等于尚未支付额或净融资缺口，600 万元工资及流转也未见独立支出依据。[D01、D08]\n\nD07 报告现有流贷余额 1200 万元、可提用额度 500 万元。1200 万元是债务余额，500 万元是函件所述可提用额度；两者都不能直接当成当前自由现金。需核实额度条件、用途限制、到期安排和是否已被其他计划占用。[D07]\n\n当前材料不能证明 3000 万元净缺口，也不能给出另一准确缺口数字。还缺少全账户余额、受限资金、未来付款时点、订单已付款及未付款额、工资支出依据、客户回款安排、已有融资用途和债务偿付计划。不用集团现金流或 6200 万元可见入账总额填补这些缺失。[D01—D03、D05、D07、D08]\n\n## 未知与下一步取证\n\n1. 主体与账户范围：补借款主体法人识别资料、集团合并范围和关联关系、全部开户及账户归属清单、全账户银行流水及余额、受限资金说明；核对单体与集团资金安排，不假定集团可随时支持单体。[D02、D03、D05]\n2. T07、T08：补协议完整附件、账户归属、POOL-B 是否有当时有效授权、原归集流出、资金中心往来台账及双向流水；若属于拆借，补合同、到期及偿付条款，以判定返还或新增债务。[D06、T07、T08]\n3. T10 与 I04：补第三方 X 身份及付款路径、代付授权、客户与第三方确认、I04 合同/验收/发票金额和未收额、T06 与已核销记录；据实际清偿范围决定配对，不因参考号相同直接核销 450 万元。[D04、T06、T10]\n4. T11：取得银行回单、实际付款人身份、交易背景及合同或往来凭证；查明前保持未识别。[T11]\n5. T09：补税务退款决定、回单、税种及所属期间，确定退款性质与会计分类。[T09]\n6. 应收：澄清 2200 万元的起始日期和 5500 万元口径，补必要期间的总账及明细连续变动、合同/验收/发票、逐笔配对表、贷项调整和客户对账确认；重点核对 T06/T10 与 I04，重新计算同一截点的余额。[D04、T01—T06、T10]\n7. 资金需求：补采购订单付款进度和确认中的 700 万元依据、工资及流转预算、现金与到期债务计划、500 万元额度实际可用条件；按时点核算用途及净缺口。[D01、D07、D08]\n\n## 来源索引\n\n- D01：贷款申请，申请人陈述，2026-08-20 可得。\n- D02：2025 单体财务报表，沪澜精密传感科技有限公司，2026-08-21 可得，未作审计保证。\n- D03：2025 集团合并财务报表，沪澜智造集团，2026-08-21 可得，不可替代单体。\n- D04：应收明细与合同/验收摘录，初版，2026-08-31 可得，T10 未配对，期间表述待澄清。\n- D05：ACCT-01 可见账户流水，2026 年 1—8 月，2026-08-31 可得，账户覆盖不完整。\n- D06：资金归集协议主文，2026-08-28 可得；覆盖 ACCT-01 与 POOL-A，有效至 2026-12-31，T08 付款账户未列明。\n- D07：已有融资证明，2026-08-28 可得，合成函件。\n- D08：采购计划与订单，2026-08-27 可得。\n- T01—T11：受控材料表 inflows 的对应流水记录；金额单位为万元，全部入 ACCT-01。\n- 算术验证：受控只读 SQLite 查询，对 amount_wan 转为数值后求和；全部 6200、T01—T06 为 4000、T07 为 900、T09 为 300、T08/T10/T11 为 1000 万元。\n\n判断以当前冻结材料为止，未补造缺失信息；后续材料尚未取得。\u003c/pre>\u003c/details>\u003cp class=\"badge\">原录制调用：读取材料 1 次；只读查询 1 次。\u003c/p>\u003cdetails>\u003csummary>实际只读查询与工具返回\u003c/summary>\u003cpre>[\n  {\n    &quot;executed_at_utc&quot;: &quot;2026-10-07T11:33:26.980066+00:00&qu rmed", "source_refs": ["D05", "D06"]}, {"txn_id": "T08", "amount": 400, "category": "unclassified", "source_refs": ["D05"]}, {"txn_id": "T09", "amount": 300, "category": "tax_refund", "source_refs": ["D05"]}, {"txn_id": "T10", "amount": 450, "category": "unclassified", "source_refs": ["D05"]}, {"txn_id": "T11", "amount": 150, "category": "unclassified", "source_refs": ["D05"]}], "receivable_closing_wan": 3700, "status": "needs_independent_review", "unresolved": ["T11性质", "其他账户与付款", "净资金缺口", "补充凭证真实性"], "execution": "SQLite query actually executed; no model call", "synthetic": true}}, {"chapter": "融资证据", "title": "9月3日新增了什么证据？", "question": "签署日期早，是否就能用于8月31日判断？", "content": "\u003ctable>\u003cthead>\u003ctr>\u003cth>材料\u003c/th>\u003cth>摘录\u003c/th>\u003cth>材料日期\u003c/th>\u003cth>首次可得\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>D09\u003c/td>\u003ctd>T08的400万元归集返还；非销售回款\u003c/td>\u003ctd>2026-08-01\u003c/td>\u003ctd>2026-09-03\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D10\u003c/td>\u003ctd>450万元代付对应I04，允许将T10配对至应收\u003c/td>\u003ctd>2026-08-25\u003c/td>\u003ctd>2026-09-03\u003c/td>\u003c/tr>\u003ctr>\u003ctd>D11\u003c/td>\u003ctd>期末应收3250万元；更正配对回款4450万元\u003c/td>\u003ctd>2026-09-03\u003c/td>\u003ctd>2026-09-03\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>", "takeaway": "关系生效时间与材料首次可得时间分别判断；后补材料不改写历史依据。", "record": null}, {"chapter": "融资证据", "title": "模型补证分析与实际重算", "question": "补证支持改变哪项分类？", "content": "\u003cdiv class=\"compare\">\u003cdiv>\u003cp class=\"badge\">目标模型：Qwen3.8-max\u003cbr>以下为既有录制回应示例\u003c/p>\u003cdiv class=\"model-excerpt\">\u003cp>新增 D09 支持把 T08 的 400 万元由“性质待核的集团相关入账”改为“资金归集返还”。\u003c/p>\u003c/div>\u003cdetails>\u003csummary>模型完整回应（原样保留）\u003c/summary>\u003cpre># 沪澜精密传感融资核验：补充材料重审\n\n本阶段材料首次可得截止推进至 2026-09-03。案例为教学合成，以下为证据解释和分类建议，不构成授信批准，也不修改业务数据。本阶段受控入口调用两次：材料读取一次、只读查询一次。2026-08-31 的初始回应保持原样。\n\n## 结论与推理摘要\n\n新增 D09 支持把 T08 的 400 万元由“性质待核的集团相关入账”改为“资金归集返还”。新增 D10 的客户确认与第三方付款委托支持把 T10 的 450 万元由“第三方入账待核”改为“客户代付回款，建议配对至 I04 应收”；D10 明示真伪与权源仍需审查。D11 报告更正已配对回款 4450 万元、期末应收 3250 万元，支持更新当前材料所报余额，但尚未完成原账调整与总账一致性的独立复核。[D09—D11、T08、T10]\n\n当前材料支持的入账解释为：客户回款 4450 万元（T01—T06 加 T10）、归集返还 1300 万元（T07 加 T08）、流水名义税费退款 300 万元（T09）、未识别入账 150 万元（T11），合计仍为 6200 万元。查询核对了各组金额。850 万元获得新增分类证据，不是新增入账，也不是新增收入；T10 已在初始 6200 万元总额内，不再加一次。[D04—D06、D09—D11、T01—T11]\n\n主体口径和资金缺口判断不变：2025 年借款主体单体收入 9600 万元、经营现金流净额 480 万元属于 D02；集团收入 21000 万元、经营现金流净额 3000 万元属于 D03，不能替代或相加。6200 万元只覆盖 ACCT-01 的 2026 年 1—8 月入账，仍不能证明全企业现金流净额、当期销售收入、可支配余额或 3000 万元净融资缺口。[D01—D03、D05、D07、D08]\n\n## 与 2026-08-31 判断的逐项比较\n\n| 项目 | 原判断（截至 8 月 31 日可得证据） | 本次判断（截至 9 月 3 日可得证据） | 新增证据及限制 |\n|---|---|---|---|\n| T08，400 万元 | POOL-B 未列入已可得协议，性质待核；不外推 T07 的归集解释 | 建议归为归集返还，非销售回款 | D09 的账户附件列入 POOL-B，内部往来可回溯，并明确该款为归集返还。该附件首次可得日是 9 月 3 日。[D06、D09、T08] |\n| T10，450 万元 | 第三方代付关系待证，虽有 I04 参考号仍不建议核销应收 | 材料支持客户代付回款，建议配对 I04；执行核销前复核真伪、权限和重复配对 | D10 的客户确认与付款委托明确 450 对应 I04；D11 配对总额增加 450。D10 状态仍要求审查真伪与权源。[D04、D10、D11、T06、T10] |\n| 配对回款 | D04 初版所报 4000 万元，T01—T06 合计一致 | D11 更正所报 4450 万元，T01—T06 加 T10 合计一致 | 增量 450 对应 T10；总额一致尚不能替代逐笔配对和核销审查。[D04、D10、D11] |\n| 应收余额 | 初版所报 3700；3250 仅为 T10 有效清偿等条件满足后的测算 | 更正明细所报 3250，已从纯条件测算变为有新增文件支持的更正余额；独立验证未完成 | D11 报告 3250，并要求复核原账调整与总账一致。D04 的期间歧义和更正余额截点仍需确认。[D04、D11] |\n| 性质待核入账合计 | T08、T10、T11 合计 1000 万元 | 在采纳 D09/D10 解释的分类汇总中，未识别项剩 T11 的 150 万元；T10 凭证核验仍未完成 | 新证据覆盖 850，未覆盖 T11；不能表述为全部经济性质已独立核实。[D09、D10、T08、T10、T11] |\n| 账户范围、主体范围及融资净缺口 | 单账户不代表全企业；单体不能被集团替代；3000 万元净缺口未证实 | 保持原判断 | 新文件没有补齐全账户、现金余额、支出时点及净需求证据。[D01—D03、D05、D07、D08] |\n\n## 逐笔分类建议\n\n| 入账 | 金额（万元） | 本次建议 | 依据与未完成核验 |\n|---|---:|---|---|\n| T01 | 700 | 客户回款，初步配对；账龄归属待核 | 宁波源控、O01，属于原 4000 万元组合；仍缺逐笔核销映射，不凭 O01 自动判为期初应收。[T01、D04、D11] |\n| T02 | 500 | 客户回款，初步配对；账龄归属待核 | 苏州晶测、O02，依据同上。[T02、D04、D11] |\n| T03 | 900 | 客户回款，初步配对 | 宁波源控、I01；原组合总额吻合，仍需逐笔应收对应。[T03、D04、D11] |\n| T04 | 900 | 客户回款，初步配对 | 苏州晶测、I02；不能由入账确认收入期间。[T04、D04、D11] |\n| T05 | 600 | 客户回款，初步配对 | 嘉兴微构、I03；逐笔核销映射待核。[T05、D04、D11] |\n| T06 | 400 | 客户回款，初步配对；与 T10 联合核对 I04 | 合肥纳仪、I04；新增材料将 T10 的 450 也指向 I04，应核对该义务金额、两笔合计 850 的清偿范围及重复核销。[T06、T10、D10、D11] |\n| T07 | 900 | 资金归集返还，保持原建议 | D06 覆盖 POOL-A 且在有效期内；仍需完整原归集流出与资金台账，不列销售回款。[T07、D06] |\n| T08 | 400 | 资金归集返还，按新增证据重新分类 | D09 列入 POOL-B、往来可回溯，并明确非销售回款。建议核验原附件和往来路径。原流水“未列账户”的描述保留为冻结字段，不改业务记录。[T08、D06、D09] |\n| T09 | 300 | 税费退款，按流水名义暂列 | 没有新增退款凭证；仍需税种、期间及税务决定，不列销售回款。[T09、D05] |\n| T10 | 450 | 客户代付回款，新增证据支持配对建议；凭证真伪和权源待核 | D10 明确对应 I04，D11 配对回款增加 450。核验客户和第三方确认、委托权限、I04 未收额以及 T06 后才能执行业务核销。原流水“代付关系待证”的描述保留。[T10、T06、D10、D11] |\n| T11 | 150 | 未识别入账，保持原判断 | 没有新增付款人或背景证据。[T11] |\n\n## 应收更正的核对与边界\n\n原版 D04 的算式是 2200 + 5500 - 4000 = 3700 万元。本次 D11 报告配对回款 4450 万元，增加 450 万元恰与 T10 相符；沿用原版期初和本期增加口径，可得到 2200 + 5500 - 4450 = 3250 万元，与 D11 所报余额相符。两版应收余额相差 450 万元；T08 为归集返还，不因重新分类而再减少应收。[D04、D09—D11、T08、T10]\n\n这完成了材料之间的算术勾稽，尚未完成总账和原始凭证核验。D11 未给出逐笔调整分录；D10 要求审查真伪与权源。需确认 T10 未被原 4000 万元重复核销，核对 T06 的 400 万元与 T10 的 450 万元分别清偿 I04 哪部分，确认余额足够、没有退货折让、误配、费用或其他调整。[D04、D10、D11、T06、T10]\n\nD04 的范围仍写“2025 期初与 2026 年 1—8 月”，新增摘录没有明确纠正该期间口径；D11 的“期末”也应确认具体余额日期。不能自行把 2200 万元改写为 2026 年期初。若确为 2025 年期初，需要补齐到目标余额截点的连续变动。5500 万元的应收增加、收入、含税和其他调整口径也待核。[D04、D11]\n\n因此，本次采用“D11 更正明细所报期末应收 3250 万元，需复核”的表述。此前的 3700 万元仍作为当时初版资料所报余额保留；不把它重写为当时已经知道 3250 万元，也不把本次更正当作已经完成业务记账。\n\n## 如何保留历史判断\n\n以 available_at 界定当时证据范围。D09 文件日期虽为 2026-08-01、D10 日期虽为 2026-08-25，两者首次可得日期均为 2026-09-03，且状态明示事后补交。它们可用于本次重审解释 8 月交易，却不能被放进 8 月 31 日决策的可得证据集合。[D09、D10]\n\n保留 recordings/classroom/credit-initial/response.md 与 response.json 原样；本次结论只写入 credit-supplement。变化记录同时保存原判断、新判断、新增来源及首次可得日。历史版本中的“待核”和条件测算反映当时证据边界，新增材料并不使这些历史表述失实。后续若凭证核验失败，应追加新的复核判断，保留本次依据与限制。\n\n## 仍不足的证据与下一步\n\n1. D09：核验完整账户附件的真实性、批准及生效范围、POOL-B 归属、内部往来与原归集路径；区分材料日期、首次可得日及适用期间，保留事后补交记录。[D06、D09、T08]\n2. D10/I04：核验第三方 X 与客户身份、付款委托原件、签署权限、客户及付款方确认、银行回单；核对 I04 合同/验收/发票、应收余额以及 T06/T10 的独立清偿范围与核销记录。[D10、T06、T10]\n3. D11：取得更正的明细、原版明细、调整原因与分录、总账及客户对账确认；验证 4450 和 3250 的逐笔来源与余额日期，澄清 D04 期间及 5500 口径，补齐必要期间的连续变动。[D04、D11]\n4. T11：补付款人身份、回单、合同或往来背景，未查明前保持未识别。[T11]\n5. T09：补税务退款决定、税种及所属期间，核定退款与现金流分类。[T09]\n6. 全企业资金及净融资需求：补全账户流水、余额及受限资金，采购付款进度与 700 万元供 使用报告时点唯一有效的客户归属。现有 SQL 按客户取全历史的 `MAX(effective_from)`，没有把 `s.as_of` 放进版本选择条件，也没有检查 `effective_to_exclusive`。因此，它会把报告日之后生效的归属提前套到历史余额。\n\n**实际证据与原因比较**\n\nQ01—Q08 对应本次按顺序实际执行的 8 次只读查询，完整 SELECT、检查条件与结果说明见同目录 `response.json` 的 `validation_queries`。材料读取为另 1 次受控入口调用。\n\n| 报告日 | 源表/现有加工行数 | 不同贷款数 | 客户数 | 源表/现有加工本金（万元） |\n|---|---:|---:|---:|---:|\n| 2026-07-31 | 40 / 40 | 40 / 40 | 20 / 20 | 9,640 / 9,640 |\n| 2026-08-31 | 40 / 40 | 40 / 40 | 20 / 20 | 9,820 / 9,820 |\n\nQ01 证明冻结样本没有观察到贷款本金重复或遗漏。40 笔贷款属于 20 个客户，同客户多笔贷款是正常粒度，不能按客户去重。7 月到 8 月总额增加 180 万元来自输入快照的金额变化；它不能解释同一报告日内的归属错误。\n\nQ02 证明两个月各 20 个客户均恰好匹配 1 条有效历史，缺失和歧义客户数均为 0。因此，报告时点的历史缺失或重叠也不能解释本次错误。这个结论只覆盖两个报告时点。\n\nQ03 的实际差异如下，当前与时点归属用同一笔快照本金比较：\n\n| 报告日 | 客户 | 笔数 | 受影响本金（万元） | 当前归属 → 时点归属 | 当前错误选用版本开始日 |\n|---|---|---:|---:|---|---|\n| 2026-07-31 | C07 | 2 | 405 | B01/G02 → B03/G02 | 2026-09-01 |\n| 2026-07-31 | C12 | 2 | 515 | B04/G03 → B04/G02 | 2026-08-15 |\n| 2026-07-31 | C14 | 2 | 559 | B02/G02 → B02/G04 | 2026-09-03 |\n| 2026-07-31 | C16 | 2 | 603 | B02/G01 → B04/G01 | 2026-08-20 |\n| 2026-08-31 | C07 | 2 | 414 | B01/G02 → B03/G02 | 2026-09-01 |\n| 2026-08-31 | C14 | 2 | 600 | B02/G02 → B02/G04 | 2026-09-03 |\n\n据 Q03 逐项加总，7 月为 8 笔、2,082 万元，8 月为 4 笔、1,014 万元。这是归属受影响本金的分析计算，不是全行本金增减。C12、C16 的 8 月版本在 8 月末已生效，不能把这两户两个月都回退到旧版本。Q07 已检查其 8 月分别为 B04/G03、B02/G01。\n\n综合 SQL 机制和 Q03，合理原因是“最新归属回填到历史月份”。若业务想按最新归属重述历史，需另行明确口径；提供的规则明确要求报告时点归属，现有加工与该规则不符。\n\nQ04 进一步证明总额相等不能保证管理分项正确：\n\n| 报告日 | 维度 | 分项 | 当前金额 | 时点金额 | 当前减时点（万元） |\n|---|---|---|---:|---:|---:|\n| 2026-07-31 | 支行 | B01 | 2,650 | 2,245 | +405 |\n| 2026-07-31 | 支行 | B02 | 2,958 | 2,355 | +603 |\n| 2026-07-31 | 支行 | B03 | 2,060 | 2,465 | -405 |\n| 2026-07-31 | 支行 | B04 | 1,972 | 2,575 | -603 |\n| 2026-07-31 | 集团 | G02 | 1,884 | 1,840 | +44 |\n| 2026-07-31 | 集团 | G03 | 2,443 | 1,928 | +515 |\n| 2026-07-31 | 集团 | G04 | 1,457 | 2,016 | -559 |\n| 2026-08-31 | 支行 | B01 | 2,704 | 2,290 | +414 |\n| 2026-08-31 | 支行 | B03 | 2,096 | 2,510 | -414 |\n| 2026-08-31 | 集团 | G02 | 1,952 | 1,352 | +600 |\n| 2026-08-31 | 集团 | G04 | 1,580 | 2,180 | -600 |\n\n这里只列出偏差非零的分项。7 月 G02 净高估仅 44 万元，却包含 C12 的 515 万元错出与 C14 的 559 万元错入；净额抵消会掩盖错误。支行和集团是同一批本金的不同维度，不能把两个维度的金额再相加。\n\n**可审阅的修复候选**\n\n使用左闭右开区间 `effective_from &lt;= as_of &lt; effective_to_exclusive`。先统计每个客户在报告时点的有效版本数，只有恰好 1 条才填入归属；0 条或多条保留贷款本金、归属留空并明确标记，交由异常门禁拦截。该候选限定本次两个报告日，金额文本明确转换为 NUMERIC。\n\n```sql\nWITH report_snapshots AS (\n  SELECT as_of, loan_id, customer_id, balance_wan\n  FROM snapshots\n  WHERE as_of IN (&#x27;2026-07-31&#x27;, &#x27;2026-08-31&#x27;)\n), report_customers AS (\n  SELECT DISTINCT as_of, customer_id FROM report_snapshots\n), active_counts AS (\n  SELECT r.as_of, r.customer_id, COUNT(h.customer_id) AS active_count\n  FROM report_customers r\n  LEFT JOIN history h ON h.customer_id = r.customer_id\n    AND h.effective_from &lt;= r.as_of\n    AND r.as_of &lt; h.effective_to_exclusive\n  GROUP BY r.as_of, r.customer_id\n)\nSELECT s.as_of, s.loan_id, s.customer_id,\n       CAST(s.balance_wan AS NUMERIC) AS balance_wan,\n       h.branch_id, h.group_id,\n       c.active_count AS active_history_count,\n       CASE\n         WHEN c.active_count = 1 THEN &#x27;OK&#x27;\n         WHEN c.active_count = 0 THEN &#x27;MISSING&#x27;\n         ELSE &#x27;AMBIGUOUS&#x27;\n       END AS assignment_status\nFROM report_snapshots s\nJOIN active_counts c ON c.as_of = s.as_of AND c.customer_id = s.customer_id\nLEFT JOIN history h ON h.customer_id = s.customer_id\n  AND h.effective_from &lt;= s.as_of\n  AND s.as_of &lt; h.effective_to_exclusive\n  AND c.active_count = 1\nORDER BY s.as_of, s.loan_id;\n```\n\n这条 SELECT 的前提是源快照本金粒度唯一。它不会任意选一个重叠版本，也不应由下游简单过滤非 OK 行后汇总。源粒度检查、归属状态与空值检查必须通过，再提交业务审阅。这里提供的是候选 SQL，没有执行任何业务写入。\n\n**回归检查及实际验证**\n\n| 检查 | 实际结果 | 解释 |\n|---|---|---|\n| Q01：源与当前加工的行数、不同贷款数、本金 | 两个月都对平 | 证明样本未重复/遗漏，不能单独作为报表正确标准 |\n| Q02：每客户每报告日有效版本数 | 全部为 1，无缺失、无歧义 | 验证输入在目标时点具备唯一归属 |\n| Q05：完整候选的行数、本金、状态、空归属 | 各月 40 行、40 个不同贷款；9,640/9,820 万元；行数差、本金差、未解决数、空归属数均为 0 | 验证候选保持本金一次计入 |\n| Q06：生效日前一天及生效日等 10 个日期探针 | 10 个全部 PASS | 验证左闭右开边界，探针不是新增快照 |\n| Q07：4 个变更客户 × 2 个月 | 8 个组合全部 PASS，每组 2 笔，归属不匹配数为 0 | 确认 7 月旧归属与 8 月应有的新旧归属 |\n| Q08：只读 CTE 缺失/重复有效版本故障探针 | 两种场景均保留 2 笔、405 万元；分别标记 MISSING/AMBIGUOUS，归属留空 | 验证异常不会丢失或重复本金，并能交给门禁 |\n\nQ08 仅在 SELECT 的派生 CTE 中暂时排除或复制历史行，未修改输入。它不能作为实际冻结材料存在缺失、重叠的证据；实际样本没有这些问题已由 Q02 验证。\n\n后续回归还应运行下面两项门禁。它们是拟议的独立检查，本次没有单独调用；对应事实已分别由 Q01、Q05 检查。完整异常门禁 SELECT 也保存在 `response.json` 的 R10。\n\n源快照粒度门禁 R09，预期返回 0 行：\n\n```sql\nSELECT as_of, loan_id, COUNT(*) AS row_count\nFROM snapshots\nWHERE as_of IN (&#x27;2026-07-31&#x27;, &#x27;2026-08-31&#x27;)\nGROUP BY as_of, loan_id\nHAVING COUNT(*) &lt;&gt; 1 OR loan_id IS NULL;\n```\n\n候选异常门禁 R10 将完整候选作为 `candidate` CTE，返回 `assignment_status &lt;&gt; &#x27;OK&#x27;`、`active_history_count &lt;&gt; 1` 或支行/集团为空的贷款，预期返回 0 行。任何异常均应阻止进入正式支行、集团汇总，并交由责任人复核。\n\n**待业务与实施复核**\n\n1. 核对四张变更工单的支行、集团和生效日期。查询证明输入如何影响报表，尚未证明工单已经批准或源记录一定真实。\n2. 确认生产本金粒度、报告时点与排他终止日语义。当前验证只覆盖两个冻结月份；其他月份及“当时系统已知版本”的口径未验证。\n3. 在目标数据库复核 SQL 方言、日期类型和金额精度。SQLite 的 NUMERIC 适用于本次整数金额样本，正式系统应使用约定的精确金额类型并检查无效金额文本。\n4. 正式汇总需同时通过本金粒度、唯一有效归属、状态与空值门禁，核对分项，并由业务与数据责任人审阅。不能用按客户去重、任意挑一个版本或过滤异常行来掩盖错误。\n\n本次受控入口实际调用 9 次：材料读取 1 次，只读查询 8 次。输入未修改；未批准修复，也未放行报表。\u003c/pre>\u003c/details>\u003cp class=\"badge\">原录制调用：读取材料 1 次；只读查询 8 次。\u003c/p>\u003cdetails>\u003csummary>实际只读查询与工具返回\u003c/summary>\u003cpre>[\n  {\n    &quot;executed_at_utc&quot;: &quot;2026-10-07T11:33:42.634738+00:00&quot;,\n    &quot;input_sha256&quot;: &quot;4d817f419a94846c26dedecedde13463076dc8209d8b30ef0547262ab52b394d&quot;,\n    &quot;request&quot;: {\n      &quot;phase&quot;: &quot;report&quot;,\n      &quot;action&quot;: &quot;materials&quot;,\n      &quot;sql&quot;: null\n    },\n    &quot;result&quot;: {\n      &quot;case&quot;: &quot;行内对公流贷月末管理报表，教学合成材料&quot;,\n      &quot;business_rule&quot;: &quot;每笔本金余额计入一次；支行与集团归属采用该报告时点唯一有效的客户归属。检查7月与8月。&quot;,\n      &quot;current_sql&quot;: &quot;SELECT s.as_of,s.loan_id,s.customer_id,s.balance_wan,h.branch_id,h.group_id\\nFROM snapshots
